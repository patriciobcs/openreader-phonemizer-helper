name: Helper checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-protocol:
    name: Source protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install the pinned helper environment
        run: |
          uv venv --python 3.12
          uv pip sync --python .venv/bin/python --require-hashes requirements.txt
      - name: Exercise the source protocol
        run: .venv/bin/python scripts/smoke.py --python .venv/bin/python
